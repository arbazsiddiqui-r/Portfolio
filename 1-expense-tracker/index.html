<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pocket Money Diary</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="notebook">
    <h1>Pocket Money Diary</h1>
    <p class="sub">Write down what you spend. See where it goes.</p>

    <!-- three small boxes at the top -->
    <div class="totals">
      <div class="box">
        <span>Money in</span>
        <strong id="incomeTotal">₹0</strong>
      </div>
      <div class="box">
        <span>Money out</span>
        <strong id="expenseTotal">₹0</strong>
      </div>
      <div class="box">
        <span>Left</span>
        <strong id="balance">₹0</strong>
      </div>
    </div>

    <form id="entryForm">
      <input type="text" id="title" placeholder="What was it? (eg. canteen lunch)" required>
      <input type="number" id="amount" placeholder="Amount" min="1" required>

      <select id="type">
        <option value="expense">I spent</option>
        <option value="income">I got</option>
      </select>

      <select id="category">
        <option>Food</option>
        <option>Travel</option>
        <option>Books</option>
        <option>Fun</option>
        <option>Other</option>
      </select>

      <button type="submit">Add</button>
    </form>

    <div class="filterRow">
      <label for="filter">Show:</label>
      <select id="filter">
        <option value="all">Everything</option>
        <option value="Food">Food</option>
        <option value="Travel">Travel</option>
        <option value="Books">Books</option>
        <option value="Fun">Fun</option>
        <option value="Other">Other</option>
      </select>
      <button id="clearBtn" type="button">Clear all</button>
    </div>

    <ul id="list"></ul>
    <p id="emptyMsg">Nothing written yet.</p>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
